[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a5-serve-model"
version = "0.1.0b3"
description = "Deploy a fine-tuned BERT classifier as a bearer-protected container endpoint."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.8.0","transformers==4.52.4","peft==0.15.2","onnx==1.17.0","onnxruntime==1.22.1","numpy>=1.26,<3"]

[project.scripts]
serve-model = "serve_model.cli:main"

[tool.setuptools.package-data]
serve_model = ["sample/*","base/*"]
